<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Bildhaan" />
  <title>Install Bildhaan Parking</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F4F8FF;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid #DBEAFE;
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
    }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { margin: 16px 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #64748B; font-size: 15px; line-height: 1.45; }
    button, a.btn {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 10px;
    }
    #install { background: #2563EB; color: #fff; }
    .chrome { background: #EFF6FF; color: #2563EB; }
    .open { background: #0F172A; color: #fff; }
    #status { font-size: 13px; color: #2563EB; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Bildhaan" />
    <h1>Bildhaan Parking</h1>
    <p>Ku rakib telefoonkaaga si aad ugu furto sida app.</p>
    <button id="install" type="button">Install app</button>
    <a class="btn chrome" id="chrome" href="intent://app.bildhaan.dirshay.com/login#Intent;scheme=https;package=com.android.chrome;end">Open in Chrome</a>
    <a class="btn open" href="/login">Open app</a>
    <div id="status"></div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' });
    }
    let deferred = null;
    const status = document.getElementById('status');
    const btn = document.getElementById('install');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferred = e;
      status.textContent = 'Diyaar — taabo Install app';
    });
    window.addEventListener('appinstalled', () => {
      status.textContent = 'Waa la rakibay. Fur home screen-ka.';
    });
    btn.addEventListener('click', async () => {
      if (deferred) {
        deferred.prompt();
        const { outcome } = await deferred.userChoice;
        deferred = null;
        status.textContent = outcome === 'accepted' ? 'Waa la rakibay.' : 'Waa la joojiyay.';
        return;
      }
      const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      if (standalone) {
        status.textContent = 'App-ku horey ayaa u rakibmay.';
        return;
      }
      status.textContent = 'Fur Chrome, kadib menu ⋮ → Install app.';
      location.href = 'intent://app.bildhaan.dirshay.com/login#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=https%3A%2F%2Fapp.bildhaan.dirshay.com%2Flogin;end';
    });
  </script>
</body>
</html>
